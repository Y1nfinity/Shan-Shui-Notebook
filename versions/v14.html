  }

  // MEM: the scroll's state: generated pieces, how far they reach, and the view.
  MEM = {
    canv: "",
    chunks: [],
    xmin: 0,
    xmax: 0,
    cwid: 512,
    cursx: 0,
    lasttick: 0,
    windx: 3000,
    windy: 800,
    planmtx: [],
  };

  // dummyloader(): an unused test helper from the original that lines up one
  // kind of object; kept for experimenting.
  function dummyloader(xmin, xmax) {
    for (var i = xmin; i < xmax; i += 200) {
      //MEM.chunks.push({tag:"?",x:i,y:100,canv:Tree.tree08(i,500,i)})
      //MEM.chunks.push({tag:"?",x:i,y:100,canv:Man.man(i,500)})
      //MEM.chunks.push({tag:"?",x:i,y:100,canv:Arch.arch01(i,500)})
      //MEM.chunks.push({tag:"?",x:i,y:100,canv:Arch.boat01(i,500)})
      //MEM.chunks.push({tag:"?",x:i,y:100,canv:Arch.transmissionTower01(i,500)})
      MEM.chunks.push({
        tag: "?",
        x: i,
        y: 100,
        canv: Arch.arch02(i, 500, 0, { sto: 1, rot: Math.random() }),
      });
    }
  }

  // chunkloader(): generates new stretches of scroll as the view moves, draws
  // every planned piece, and keeps them sorted from back to front.
  function chunkloader(xmin, xmax) {
    var add = function(nch) {
      if (nch.tag != "rule") {
        nch.canv = inkify(nch.canv);
      }
      // how far the piece really reaches left and right (measured once from
      // its own coordinates), so a tile only takes the pieces that touch it
      if (nch.xl === undefined) {
        var xl = Infinity, xr = -Infinity, m, re = /(?:points='|\s|[ML])(-?\d+(?:\.\d+)?)[ ,]-?\d/g;
        while ((m = re.exec(nch.canv))) {
          var v = +m[1];
          if (v < xl) xl = v;
          if (v > xr) xr = v;
        }
        nch.xl = xl == Infinity ? nch.x : xl - 4;
        nch.xr = xr == -Infinity ? nch.x : xr + 4;
      }
      if (nch.canv.includes("NaN")) {
        console.log("gotcha:");
        console.log(nch.tag);
        nch.canv = nch.canv.replace(/NaN/g, -1000);
      }
      if (MEM.chunks.length == 0) {
        MEM.chunks.push(nch);
        return;
      } else {
        if (nch.y <= MEM.chunks[0].y) {
          MEM.chunks.unshift(nch);
          return;
        } else if (nch.y >= MEM.chunks[MEM.chunks.length - 1].y) {
          MEM.chunks.push(nch);
          return;
        } else {
          for (var j = 0; j < MEM.chunks.length - 1; j++) {
            if (MEM.chunks[j].y <= nch.y && nch.y <= MEM.chunks[j + 1].y) {
              MEM.chunks.splice(j + 1, 0, nch);
              return;
            }
          }
        }
      }
      console.log("EH?WTF!");
      console.log(MEM.chunks);
      console.log(nch);
    };

    while (xmax > MEM.xmax - MEM.cwid || xmin < MEM.xmin + MEM.cwid) {
      console.log("generating new chunk...");

      var plan, cx0;
      if (xmax > MEM.xmax - MEM.cwid) {
        cx0 = MEM.xmax;
        plan = mountplanner(MEM.xmax, MEM.xmax + MEM.cwid);
        MEM.xmax = MEM.xmax + MEM.cwid;
      } else {
        cx0 = MEM.xmin - MEM.cwid;
        plan = mountplanner(MEM.xmin - MEM.cwid, MEM.xmin);
        MEM.xmin = MEM.xmin - MEM.cwid;
      }
      // the lower rules, carried on as water once the scroll has begun
      Notebook.waterRules(cx0, cx0 + MEM.cwid).forEach(add);
      Notebook.skyRules(cx0, cx0 + MEM.cwid).forEach(add);

      for (var i = 0; i < plan.length; i++) {
        // the drawing begins on page 3: pages 1 and 2 are the notebook's
        if (plan[i].x < Notebook.B0 + 250) {
          continue;
        }
        if (plan[i].tag == "mount") {
          add({
            tag: plan[i].tag,
            x: plan[i].x,
            y: plan[i].y,
            canv: Mount.mountain(plan[i].x, plan[i].y, i * 2 * Math.random()),
            //{col:function(x){return "rgba(100,100,100,"+(0.5*Math.random()*plan[i].y/MEM.windy)+")"}}),
          });
          add({
            tag: plan[i].tag,
            x: plan[i].x,
            y: plan[i].y - 10000,
            canv: water(plan[i].x, plan[i].y, i * 2),
          });
        } else if (plan[i].tag == "flatmount") {
          add({
            tag: plan[i].tag,
            x: plan[i].x,
            y: plan[i].y,
            canv: Mount.flatMount(
              plan[i].x,
              plan[i].y,
              2 * Math.random() * Math.PI,
              {
                wid: 600 + Math.random() * 400,
                hei: 100,
                cho: 0.5 + Math.random() * 0.2,
              },
            ),
          });
        } else if (plan[i].tag == "distmount") {
          add({
            tag: plan[i].tag,
            x: plan[i].x,
            y: plan[i].y,
            canv: Mount.distMount(plan[i].x, plan[i].y, Math.random() * 100, {
              hei: 150,
              len: randChoice([500, 1000, 1500]),
            }),
          });
        } else if (plan[i].tag == "boat") {
          // the original boat, kept clear of the red margin
          var bx = Notebook.avoidMargin(plan[i].x, (plan[i].y / 800) * 70);
          add({
            tag: plan[i].tag,
            x: bx,
            y: plan[i].y,
            canv: Arch.boat01(bx, plan[i].y, Math.random(), {
              sca: plan[i].y / 800,
              fli: randChoice([true, false]),
            }),
          });
        } else if (plan[i].tag == "redcirc") {
          add({
            tag: plan[i].tag,
            x: plan[i].x,
            y: plan[i].y,
            canv:
              "<circle cx='" +
              plan[i].x +
              "' cy='" +
              plan[i].y +
              "' r='20' stroke='black' fill='red' />",
          });
        } else if (plan[i].tag == "greencirc") {
          add({
            tag: plan[i].tag,
            x: plan[i].x,
            y: plan[i].y,
            canv:
              "<circle cx='" +
              plan[i].x +
              "' cy='" +
              plan[i].y +
              "' r='20' stroke='black' fill='green' />",
          });
        }
        // add ({
        //   x: plan[i].x,
        //   y: plan[i].y,
        //   canv:"<circle cx='"+plan[i].x+"' cy='"+plan[i].y+"' r='20' stroke='black' fill='red' />"
        // })
      }
    }
  }

  // chunkrender(): joins the pieces that reach into [xmin, xmax] into one SVG
  // string, back to front.
  function chunkrender(xmin, xmax) {
    var parts = [];
    for (var i = 0; i < MEM.chunks.length; i++) {
      var c = MEM.chunks[i];
      if (c.xr >= xmin && c.xl <= xmax) {
        var cv = c.canv; // drawing it may tighten its extent
        if (c.xr >= xmin) parts.push(cv);
      }
    }
    MEM.canv = parts.join("");
    return MEM.canv;
  }

  // ---- building pages ----
  // The scroll is drawn as tiles, one per notebook page. Each tile is its own
  // small standalone SVG (paper, page, then the landscape multiplied on top).
  // These functions only build the SVG text; they run in the background
  // worker (or on the page with ?worker=0).
  var ZOOM = 1.142; // screen pixels per world unit (set from the window size)
  function scr(x) {
    return Math.round(x * ZOOM);
  }
  // tileDefs(): the shared SVG definitions (masks, filters, gradients) plus
  // the paper pattern; every tile carries its own copy
  var DEFS = null;
  function tileDefs() {
    if (DEFS) return DEFS;
    var tile = 512 / ZOOM;
    DEFS = Notebook.defs.replace("</defs>",
      "<pattern id='paper' patternUnits='userSpaceOnUse' width='" + tile + "' height='" + tile + "'>" +
      "<image href='" + paperURL() + "' width='" + tile + "' height='" + tile + "'/></pattern></defs>");
    return DEFS;
  }
  // tileSVG(): page k as its own SVG
  function tileSVG(k) {
    var P = Notebook.P, x0 = k * P, x1 = x0 + P, H = MEM.windy / ZOOM;
    // the drawing must exist well past the tile (pages read what follows them)
    chunkloader(x0 - P, Math.max(x1 + 1600, Notebook.T1 + 1200));
    Notebook.routes();
    // only tiles the landscape fades in on need the fade mask
    var mask = x0 < Notebook.B0 + 450 ? " mask='url(#landReveal)'" : "";
    return (
      "<svg xmlns='http://www.w3.org/2000/svg' width='" + (scr(x1) - scr(x0)) + "' height='" + MEM.windy +
      "' viewBox='" + x0 + " 0 " + P + " " + H + "' preserveAspectRatio='none'" +
      ">" + tileDefs() +
      "<rect x='" + x0 + "' y='-10' width='" + P + "' height='" + (H + 20) + "' fill='url(#paper)'/>" +
      "<g>" + Notebook.render(x0, x1) + "</g>" +
      "<g" + mask + " style='mix-blend-mode:multiply'>" + chunkrender(x0 - 2, x1 + 2) + "</g></svg>"
    );
  }
  // viewSVG(): the view starting at x0 as one standalone SVG, for downloading
  function viewSVG(x0) {
    var w = MEM.windx / ZOOM, h = MEM.windy / ZOOM;
    return (
      "<svg xmlns='http://www.w3.org/2000/svg' width='" + MEM.windx + "' height='" + MEM.windy +
      "' viewBox='" + x0 + " 0 " + w + " " + h + "'>" + Notebook.defs +
      "<g>" + Notebook.render(x0, x0 + w) + "</g>" +
      "<g mask='url(#landReveal)' style='mix-blend-mode:multiply'>" + chunkrender(x0, x0 + w) +
      "</g></svg>"
    );
  }
</script>

<script id="View">
  // ------------------------------------------------------------------
  // View: what happens on the page itself. The generator runs in a
  // background worker (built from the scripts marked "gen" above), so the
  // page only places finished pages and moves them; generating new
  // landscape never stalls the scroll. ?worker=0 does everything on the page
  // instead, as before (handy for testing, and the fallback if a worker
  // cannot be started).
  // ------------------------------------------------------------------

  // paperURL(): the tiled, faintly woven white paper, painted once on a
  // canvas with its own random numbers (so it never changes the drawing)
  var PAPER = null;
  function paperURL() {
    if (PAPER) return PAPER;
    var R = Notebook.rng(Notebook.hash(SEED + "/paper"));
    var canvas = document.createElement("canvas");
    canvas.width = canvas.height = 512;
    var ctx = canvas.getContext("2d"), reso = 512;
    for (var i = 0; i < reso / 2 + 1; i++) {
      for (var j = 0; j < reso / 2 + 1; j++) {
        var c = 251 + Noise.noise(i * 0.1, j * 0.1) * 4;
        c -= R() * 5;
        c -= (i % 2 == 0 ? 1.5 : 0) + (j % 2 == 0 ? 1.5 : 0);
        ctx.fillStyle = "rgb(" + c.toFixed(0) + "," + c.toFixed(0) + "," + (c * 0.995).toFixed(0) + ")";
        ctx.fillRect(i, j, 1, 1);
        ctx.fillRect(reso - i, j, 1, 1);
        ctx.fillRect(i, reso - j, 1, 1);
        ctx.fillRect(reso - i, reso - j, 1, 1);
      }
    }
    PAPER = canvas.toDataURL("image/png");
    return PAPER;
  }

  var VIEW = { strip: null, tiles: {}, busy: false, dir: 1 };
  var GEN = { worker: null, gen: 0, lastKey: null, onView: null };

  // the worker's side: it answers "want" (build these pages, in this order),
  // "drop" (forget that page was sent) and "view" (one SVG of a view)
  var WORKER_GLUE = function() {
    var JOB = { want: [], done: {}, gen: -1, busy: false };
    onmessage = function(e) {
      var m = e.data;
      if (m.type == "want") {
        if (m.gen != JOB.gen) { // new window size: start afresh
          JOB.gen = m.gen;
          JOB.done = {};
          ZOOM = m.zoom;
          MEM.windx = m.windx;
          MEM.windy = m.windy;
          DEFS = null;
        }
        JOB.want = m.list;
        kick();
      } else if (m.type == "drop") {
        delete JOB.done[m.k];
      } else if (m.type == "view") {
        postMessage({ type: "view", svg: viewSVG(m.x0) });
      }
    };
    // one page per turn, so new requests are read between pages
    function kick() {
      if (JOB.busy) return;
      JOB.busy = true;
      setTimeout(step, 0);
    }
    function step() {
      JOB.busy = false;
      for (var n = 0; n < JOB.want.length; n++) {
        var k = JOB.want[n];
        if (JOB.done[k]) continue;
        JOB.done[k] = true;
        postMessage({ type: "tile", k: k, gen: JOB.gen, svg: tileSVG(k) });
        kick();
        return;
      }
    }
  };

  // startWorker(): the generator's own scripts, plus the seed, the paper and
  // the glue above, become the worker
  function startWorker() {
    if (/[?&]worker=0/.test(location.search) || !window.Worker || !window.Blob) return;
    try {
      var code =
        "var window = self; var __SEED = " + JSON.stringify(SEED) + ";\n" +
        "var __PAPER = " + JSON.stringify(paperURL()) + ";\n" +
        "function paperURL() { return __PAPER; }\n" +
        (/[?&]debug=1/.test(location.search) ? "" : "console.log = function() {};\n") +
        Array.prototype.map.call(document.querySelectorAll("script.gen"), function(el) {
          return el.textContent;
        }).join("\n;\n") +
        "\n;(" + WORKER_GLUE.toString() + ")();\n";
      var url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
      GEN.worker = new Worker(url);
      GEN.worker.onmessage = function(e) {
        var m = e.data;
        if (m.type == "tile" && m.gen == GEN.gen) {
          placeTile(m.k, m.svg);
        } else if (m.type == "view" && GEN.onView) {
          GEN.onView(m.svg);
          GEN.onView = null;
        }
      };
      GEN.worker.onerror = function() { // fall back to the page
        GEN.worker = null;
        GEN.lastKey = null;
        update();
      };
    } catch (e) {
      GEN.worker = null;
    }
  }

  // setupView(): the drawing area and the sliding strip, made once per size
  function setupView() {
    var bg = document.getElementById("BG");
    if (VIEW.strip && VIEW.strip.parentNode == bg) return;
    bg.innerHTML =
      "<div id='STRIP' style='position:absolute;left:0;top:0;height:" + MEM.windy +
      "px;will-change:transform'></div>";
    bg.style.overflow = "hidden";
    bg.onmouseenter = function() { AUTO.hover = true; };
    bg.onmouseleave = function() { AUTO.hover = false; };
    VIEW.strip = document.getElementById("STRIP");
    VIEW.tiles = {};
  }
  // placeTile(): a finished page becomes an image; the browser decodes it in
  // its own time and it joins the strip only when ready
  function placeTile(k, svg) {
    if (VIEW.tiles[k]) return;
    var P = Notebook.P, x0 = k * P;
    var url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
    var img = new Image(scr(x0 + P) - scr(x0), MEM.windy);
    img.style.cssText = "position:absolute;top:0;left:" + scr(x0) + "px";
    img.decoding = "async";
    img.src = url;
    VIEW.tiles[k] = img;
    var place = function() {
      if (VIEW.tiles[k] === img) VIEW.strip.appendChild(img);
      URL.revokeObjectURL(url);
    };
    img.decode().then(place, place);
  }
  // the pages the view covers
  function viewPages() {
    var P = Notebook.P;
    return [Math.floor(MEM.cursx / P), Math.floor((MEM.cursx + MEM.windx / ZOOM) / P)];
  }
  // pagesWanted(): the visible pages first, then three ahead in the
  // direction of travel, then one behind
  function pagesWanted(r) {
    var list = [];
    for (var k = r[0]; k <= r[1]; k++) list.push(k);
    for (var d = 1; d <= 3; d++) list.push(VIEW.dir > 0 ? r[1] + d : r[0] - d);
    list.push(VIEW.dir > 0 ? r[0] - 1 : r[1] + 1);
    return list.filter(function(k) { return !VIEW.tiles[k]; });
  }

  // ---- without a worker (?worker=0): build on the page, in spare moments ----
  function buildTile(k) {
    if (!VIEW.tiles[k]) placeTile(k, tileSVG(k));
  }
  function aheadLater() {
    if (VIEW.busy) return;
    VIEW.busy = true;
    var later = window.requestIdleCallback || function(f) { return setTimeout(f, 30); };
    later(function() {
      VIEW.busy = false;
      var r = viewPages(), P = Notebook.P;
      for (var d = 1; d <= 3; d++) {
        var k = VIEW.dir > 0 ? r[1] + d : r[0] - d;
        if (VIEW.tiles[k]) continue;
        if (VIEW.dir > 0 && MEM.xmax < Math.max(k * P + P + 1600, Notebook.T1 + 1200)) {
          chunkloader(MEM.xmin + MEM.cwid, MEM.xmax - MEM.cwid + 1); // exactly one stretch
        } else {
          buildTile(k);
        }
        aheadLater();
        return;
      }
    }, { timeout: 400 });
  }

  // update(): shows the view at MEM.cursx: slides the strip, drops far-off
  // pages, and asks for the pages it needs (from the worker, or builds them)
  function update() {
    setupView();
    var r = viewPages();
    VIEW.strip.style.transform = "translate3d(" + (-MEM.cursx * ZOOM).toFixed(2) + "px,0,0)";
    for (var key in VIEW.tiles) {
      var k = +key;
      if (k < r[0] - 2 || k > r[1] + 4) {
        var el = VIEW.tiles[key];
        if (el.parentNode) el.parentNode.removeChild(el);
        delete VIEW.tiles[key];
        if (GEN.worker) GEN.worker.postMessage({ type: "drop", k: k });
      }
    }
    if (GEN.worker) {
      var list = pagesWanted(r);
      var wantKey = GEN.gen + ":" + list.join(",");
      if (wantKey != GEN.lastKey) {
        GEN.lastKey = wantKey;
        GEN.worker.postMessage({
          type: "want", gen: GEN.gen, list: list,
          zoom: ZOOM, windx: MEM.windx, windy: MEM.windy,
        });
      }
    } else {
      for (var k = r[0]; k <= r[1]; k++) buildTile(k);
      aheadLater();
    }
  }

  // downloadView(): the current view as one SVG file
  function downloadView() {
    var name = "shan-shui-notebook-" + SEED + ".svg";
    if (GEN.worker) {
      GEN.onView = function(svg) { download(name, svg); };
      GEN.worker.postMessage({ type: "view", x0: MEM.cursx });
    } else {
      download(name, viewSVG(MEM.cursx));
    }
  }
</script>

<script id="downloader">
  // download(): saves the current view as an .svg file.
  function download(filename, text) {
    var element = document.createElement("a");
    element.setAttribute(
      "href",
      "data:text/plain;charset=utf-8," + encodeURIComponent(text),
    );
    element.setAttribute("download", filename);
    element.style.display = "none";
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);
  }
</script>

<script id="UI">
  // UI: scrolling, auto-scroll, the side arrows and the settings menu.
  // xcroll() moves the view by v.
  function xcroll(v) {
    MEM.cursx += v;
    VIEW.dir = v < 0 ? -1 : 1;
    update();
  }
  // autoxcroll(): a steady glide, moved a little every frame at the speed
  // set in the menu (units per second); it pauses while the pointer is over
  // the drawing
  var AUTO = { on: false, last: 0, hover: false };
  function autoxcroll() {
    AUTO.on = document.getElementById("AUTO_SCROLL").checked;
    if (AUTO.on) {
      AUTO.last = performance.now();
      requestAnimationFrame(autoStep);
    }
  }
  function autoStep(t) {
    if (!AUTO.on) return;
    // seconds since the last frame, capped so a slow device still moves at
    // the set speed but returning to a background tab does not leap ahead
    var dt = Math.min(0.25, (t - AUTO.last) / 1000);
    AUTO.last = t;
    if (!AUTO.hover) {
      var speed = parseFloat(document.getElementById("AUTO_SPEED").value) || 60;
      MEM.cursx += speed * dt;
      VIEW.dir = 1;
      update();
    }
    requestAnimationFrame(autoStep);
  }
  function toggleVisible(id) {
    var v = document.getElementById(id).style.display == "none";
    document.getElementById(id).style.display = v ? "block" : "none";
  }
  function toggleText(id, a, b) {
    var v = document.getElementById(id).innerHTML;
    document.getElementById(id).innerHTML = v == "" || v == b ? a : b;
  }
  // reloadWSeed(): reloads the page with a new seed from the menu.
  function reloadWSeed(s) {
    var q = new URLSearchParams(location.search);
    q.set("seed", s);
    location.search = q.toString();
  }
  var btnHoverCol = "rgba(0,0,0,0.1)";
</script>

<!-- Page markup: the drawing fills the window; the controls float over it. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fbfbfa; color-scheme: light; }
  body { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: rgba(0, 0, 0, 0.6); }
  #BG { position: fixed; inset: 0; cursor: grab; touch-action: pan-y; user-select: none; }
  #BG.dragging { cursor: grabbing; }
  .ui { position: fixed; z-index: 10; }
  .btn {
    box-sizing: border-box; width: 32px; height: 32px; display: grid; place-items: center;
    border: 1px solid rgba(0, 0, 0, 0.35); background: rgba(251, 251, 250, 0.85);
    color: rgba(0, 0, 0, 0.5); cursor: pointer; text-decoration: none; user-select: none;
  }
  .btn:hover { background: rgba(230, 230, 228, 0.95); }
  #SET_BTN { left: 12px; top: 12px; }
  #SOURCE_BTN { left: 50px; top: 12px; }
  #MENU {
    left: 12px; top: 50px; padding: 10px 12px; max-width: 300px;
    background: rgba(251, 251, 250, 0.96); border: 1px solid rgba(0, 0, 0, 0.3);
  }
  #MENU .row { margin: 4px 0 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #MENU input[type="number"] { width: 5em; }
  #MENU input:not([type]) { width: 9em; }
  #MENU .credit { margin-top: 6px; font-size: 11px; color: rgba(0, 0, 0, 0.45); }
  #MENU a { color: inherit; }
  .arrow { top: 50%; transform: translateY(-50%); width: 34px; height: 90px; font-size: 20px; }
  #L { left: 0; }
  #R { right: 0; }
  body.bare .ui { display: none; }
  @media (max-width: 600px) { .arrow { display: none; } }
</style>
<body>
  <div id="BG" role="img" aria-label="A ruled notebook page whose lines become a shan shui landscape; drag or scroll to move along it"></div>

  <div class="ui btn" id="SET_BTN" title="Settings"
    onclick="toggleVisible('MENU'); toggleText('SET_BTN', '☰', '✕')">&#x2630;</div>
  <a class="ui btn" id="SOURCE_BTN" href="https://github.com/LingDong-/shan-shui-inf" target="_blank" rel="noopener"
    title="Built on {Shan, Shui}* by Lingdong Huang">&lt;/&gt;</a>

  <div class="ui" id="MENU" style="display:none">
    SEED
    <div class="row">
      <input title="random seed" id="INP_SEED" />
      <button onclick="reloadWSeed(document.getElementById('INP_SEED').value)">Generate</button>
    </div>
    VIEW
    <div class="row">
      <button title="back" onclick="xcroll(-parseFloat(document.getElementById('INC_STEP').value))">&lt;</button>
      <input title="step" id="INC_STEP" type="number" value="200" min="0" max="10000" step="20" />
      <button title="forward" onclick="xcroll(parseFloat(document.getElementById('INC_STEP').value))">&gt;</button>
    </div>
    <div class="row">
      <label><input id="AUTO_SCROLL" type="checkbox" onchange="autoxcroll()" /> Auto-scroll</label>
      <input id="AUTO_SPEED" type="number" value="60" min="5" max="600" step="5" title="auto-scroll speed, in units per second" /> /s
    </div>
    SAVE
    <div class="row">
      <button type="button" onclick="downloadView()">Download view as .SVG</button>
    </div>
    <div class="credit">
      Built on <a href="https://github.com/LingDong-/shan-shui-inf" target="_blank" rel="noopener">{Shan, Shui}*</a>
      by Lingdong Huang (MIT). Notebook after Candace Hicks.
    </div>
  </div>

  <div class="ui btn arrow" id="L" title="back" onclick="xcroll(-200)">&#x3008;</div>
  <div class="ui btn arrow" id="R" title="forward" onclick="xcroll(200)">&#x3009;</div>

  <noscript><p style="padding:2em">This drawing is generated in the browser and needs JavaScript.</p></noscript>

  <script>
    // ---- page setup ----
    // URL options: embed, auto, speed, ui, start (see the notes at the top)
    var Q = new URLSearchParams(location.search);
    var EMBED = Q.get("embed") == "1";
    var FRAMED = window.self !== window.top; // shown inside someone else's page
    if (EMBED || Q.get("ui") == "0") document.body.classList.add("bare");
    document.getElementById("INP_SEED").value = SEED;
    document.getElementById("AUTO_SPEED").value = parseFloat(Q.get("speed")) || 60;
    MEM.cursx = parseFloat(Q.get("start")) || 0;

    // layout(): fit the drawing to the window; the page's full height (about
    // 700 world units) always fills the window height, at any size
    function layout() {
      // any size works, down to a small thumbnail-sized iframe
      MEM.windx = Math.max(100, window.innerWidth);
      MEM.windy = Math.max(60, window.innerHeight);
      ZOOM = MEM.windy / 700.5;
      DEFS = null; // the paper pattern is sized in screen pixels
      GEN.gen++; // pages built for the old size are no longer wanted
      GEN.lastKey = null;
      VIEW.strip = null; // rebuild the tiles at the new size
      update();
    }
    startWorker();
    layout();
    var resizeTimer = null;
    window.addEventListener("resize", function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layout, 200);
    });

    // scrolling: wheel or trackpad, drag (mouse, pen or touch), arrow keys
    var bg = document.getElementById("BG");
    bg.addEventListener("wheel", function(e) {
      // inside someone else's page only sideways (or shift) scrolling moves the
      // drawing, so the page around it still scrolls normally
      var sideways = Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey;
      if (FRAMED && !sideways) return;
      e.preventDefault();
      var d = sideways ? e.deltaX || e.deltaY : e.deltaY;
      if (e.deltaMode == 1) d *= 30; // lines, not pixels
      xcroll(d / ZOOM);
    }, { passive: false });
    var drag = null;
    bg.addEventListener("pointerdown", function(e) {
      drag = { x: e.clientX, cursx: MEM.cursx };
      bg.setPointerCapture(e.pointerId);
      bg.classList.add("dragging");
    });
    bg.addEventListener("pointermove", function(e) {
      if (!drag) return;
      var next = drag.cursx - (e.clientX - drag.x) / ZOOM;
      VIEW.dir = next < MEM.cursx ? -1 : 1;
      MEM.cursx = next;
      update();
    });
    function endDrag() {
      drag = null;
      bg.classList.remove("dragging");
    }
    bg.addEventListener("pointerup", endDrag);
    bg.addEventListener("pointercancel", endDrag);
    window.addEventListener("keydown", function(e) {
      if (e.target.tagName == "INPUT") return;
      if (e.key == "ArrowRight") xcroll(120);
      else if (e.key == "ArrowLeft") xcroll(-120);
      else if (e.key == " ") {
        var box = document.getElementById("AUTO_SCROLL");
        box.checked = !box.checked;
        autoxcroll();
      } else return;
      e.preventDefault();
    });

    // auto-scroll: on for embeds, or when asked for
    if (Q.has("auto") ? Q.get("auto") != "0" : EMBED) {
      document.getElementById("AUTO_SCROLL").checked = true;
      autoxcroll();
    }
  </script>
</body>

<!-- Paper: the same faintly woven white texture as the tiles, behind the page. -->
<script>
  document.getElementsByTagName("body")[0].style.backgroundImage = "url(" + paperURL() + ")";
</script>
