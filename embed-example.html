<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shan Shui Notebook: embed example</title>
<style>
  body { margin: 0; font: 16px/1.6 Georgia, serif; color: #222; background: #fff; }
  main { max-width: 960px; margin: 0 auto; padding: 48px 20px; }
  .piece { position: relative; width: 100%; aspect-ratio: 16 / 7; border: 1px solid #ddd; }
  .piece iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  p.small { font-size: 14px; color: #666; }
</style>
<main>
  <h1>Shan Shui Notebook</h1>
  <p>A ruled notebook page whose lines drift, then become an endless shan shui landscape.</p>

  <!-- The embed: copy this block into your portfolio page. -->
  <div class="piece">
    <iframe src="index.html?embed=1&amp;seed=54592" title="Shan Shui Notebook, a generative landscape" loading="lazy"></iframe>
  </div>

  <p class="small">
    Generative scroll built on <a href="https://github.com/LingDong-/shan-shui-inf">{Shan, Shui}*</a>
    by Lingdong Huang (MIT). <a href="index.html">Open full screen</a>.
  </p>
  <p>The page keeps scrolling normally over the piece; drag it, or scroll sideways, to move along the landscape.</p>
</main>
</html>
